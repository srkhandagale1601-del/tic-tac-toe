services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tictactoe}
      POSTGRES_USER: ${POSTGRES_USER:-game}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-game} -d ${POSTGRES_DB:-tictactoe}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  server:
    build: ./server
    environment:
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-this}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://game:change-me@postgres:5432/tictactoe}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports: ["3001:3001"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
  client:
    build:
      context: ./client
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:3001}"
    ports: ["8080:80"]
    depends_on: [server]
    restart: unless-stopped
volumes:
  pgdata:
  redisdata:
